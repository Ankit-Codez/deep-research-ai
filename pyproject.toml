[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "deepresearch-ai"
version = "0.1.0"
description = "An evidence-grounded research assistant with sequential LangGraph agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langgraph>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "fastapi>=0.115,<1",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.10,<3",
    "httpx>=0.28,<1",
    "beautifulsoup4>=4.13,<5",
    "python-dotenv>=1.1,<2",
    "sqlalchemy>=2.1,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.16,<2",
    "pwdlib[argon2]>=0.3,<1",
    "email-validator>=2.2,<3",
    "uvicorn>=0.34,<1",
    "markdown-it-py>=3,<5",
    "bleach>=6,<7",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=1.0,<2"]
gemini = ["langchain-google-genai>=4.0,<5"]
dev = ["pytest>=8,<10"]

[project.scripts]
deepresearch-ai = "deepresearch_ai.cli:main"
deepresearch-worker = "deepresearch_ai.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deepresearch_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning:deepresearch_ai.*"]
